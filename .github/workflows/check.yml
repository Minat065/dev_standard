# この workflow は決定に依存しない静的な入口。決定に依存する部分は flow.toml から生成した tools/ci-setup.sh と Makefile が持つ。
name: check
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台帳に未決定がなく生成物が一致する（I-1）
        run: python3 tools/flow.py check
      - name: ツール導入
        run: sh tools/ci-setup.sh
      - run: make check
      - name: fmt が差分を生まなかった
        run: git diff --exit-code
